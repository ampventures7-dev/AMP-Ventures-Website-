<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://ampventures.agency/" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Primary Search Engine Optimization (SEO) -->
    <title>AMP VENTURES | Web Development Agency for Offline Businesses</title>
    <meta name="title" content="AMP VENTURES | Web Development Agency for Offline Businesses" />
    <meta name="description" content="AMP Ventures engineers lightning-fast, high-converting websites for offline businesses (salons, clinics, restaurants & retail). 95+ PageSpeed guarantee, WhatsApp booking, and 100% code ownership." />
    <meta name="keywords" content="web development agency, offline business online, salon website development, clinic appointment portal, restaurant qr menu, local seo google maps, fastapi react agency, bespoke web engineering" />
    <meta name="author" content="AMP Ventures Engineering Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Geo & Local SEO Tags -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="Bengaluru, New Delhi" />

    <!-- OpenGraph / Social Sharing (SEO & Social Discovery) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ampventures.agency/" />
    <meta property="og:site_name" content="AMP Ventures" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="AMP VENTURES | Take Your Offline Business Online" />
    <meta property="og:description" content="3 custom service tiers, 5-day rapid deployment, and automated WhatsApp & Google Maps integration for offline businesses. Founded by IIT Roorkee AI/ML & Cisco CCNA engineers." />
    <meta property="og:image" content="https://ampventures.agency/logo.png" />
    <meta property="og:image:width" content="505" />
    <meta property="og:image:height" content="241" />
    <meta property="og:image:alt" content="AMP Ventures Logo" />

    <!-- Twitter Card (SEO) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ampventures.agency/" />
    <meta name="twitter:title" content="AMP VENTURES | High-Converting Websites for Local Businesses" />
    <meta name="twitter:description" content="Sub-second page speeds, direct WhatsApp booking pipelines, and zero monthly software rent. 100% code and database ownership." />
    <meta name="twitter:image" content="https://ampventures.agency/logo.png" />

    <!-- Google Fonts: Space Grotesk & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- AEO & GEO Structured Data: ProfessionalService Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "AMP Ventures",
      "alternateName": "AMP Ventures Web Engineering",
      "url": "https://ampventures.agency/",
      "logo": "https://ampventures.agency/logo.png",
      "image": "https://ampventures.agency/logo.png",
      "description": "High-performance web development agency specializing in transitioning physical offline businesses (salons, clinics, restaurants, retail) online with sub-second speeds and automated WhatsApp booking pipelines.",
      "priceRange": "₹9,999 - ₹49,999",
      "email": "ampventures7@gmail.com",
      "telephone": "+919876543210",
      "areaServed": [
        {
          "@type": "Country",
          "name": "India"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Worldwide"
        }
      ],
      "founder": {
        "@type": "Person",
        "name": "Lead Technical Architect",
        "jobTitle": "Lead Engineer & Founder",
        "alumniOf": "IIT Roorkee",
        "hasCredential": [
          "IIT Roorkee Advanced Artificial Intelligence & Machine Learning Certification",
          "Cisco Certified Network Associate (CCNA)"
        ]
      },
      "knowsAbout": [
        "FastAPI Backend Engineering",
        "React Vite Web Development",
        "WhatsApp Business Cloud API",
        "Local Google Maps SEO",
        "Offline Business Digitization",
        "WebGL Three.js 3D Web",
        "PageSpeed Core Web Vitals Optimization"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Web Engineering Packages",
        "itemListElement": [
          {
            "@type": "Offer",
            "name": "Tier 1 — Basic Static Website",
            "price": "9999",
            "priceCurrency": "INR",
            "description": "4-6 custom responsive pages, 95+ PageSpeed guarantee, Google Maps sync, contact form with instant email alerts, and free SSL in 5-7 days."
          },
          {
            "@type": "Offer",
            "name": "Tier 2 — Premium + Custom CMS",
            "price": "24999",
            "priceCurrency": "INR",
            "description": "Custom lightweight CMS dashboard to update menus and prices, live Google Reviews embed widget, and direct WhatsApp booking in 10-12 days."
          },
          {
            "@type": "Offer",
            "name": "Tier 3 — Premium Plus (3D & AI)",
            "price": "49999",
            "priceCurrency": "INR",
            "description": "Interactive 3D WebGL hero model, WhatsApp Business API automation, 24/7 AI conversational chatbot, and VIP SLA in 14-18 days."
          }
        ]
      }
    }
    </script>

    <!-- AEO & GEO Structured Data: FAQPage Schema (For Google AI Overviews, Perplexity & SGE) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How fast will my business website be launched?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tier 1 (Basic Website) goes live in 5–7 business days. Tier 2 (Custom CMS) takes 10–12 business days, and Tier 3 (3D & AI Automation) takes 14–18 business days with guaranteed delivery milestones."
          }
        },
        {
          "@type": "Question",
          "name": "Are there recurring monthly fees or platform rent?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Development is a one-time project fee. Clients hold 100% ownership of source code, domain, and database from day 1 with zero monthly platform rent or vendor lock-in."
          }
        },
        {
          "@type": "Question",
          "name": "How does the WhatsApp 1-click booking integration work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "High-converting WhatsApp action buttons open a pre-filled appointment or order message on the client's smartphone, allowing instant booking without telephone queues."
          }
        },
        {
          "@type": "Question",
          "name": "Will my local business rank on Google Maps and near me searches?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every deployment includes on-page Local SEO, fast-loading structured data schema, Google Business Profile syncing, and review widget embeds to rank at the top of local searches."
          }
        },
        {
          "@type": "Question",
          "name": "What credentials does the AMP Ventures technical team have?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AMP Ventures is engineered by specialists holding IIT Roorkee Advanced AI/ML certification and Cisco Certified Network Associate (CCNA) enterprise cloud infrastructure fundamentals."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
